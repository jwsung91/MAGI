<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <title>MAGI 심의 흐름</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <g stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M380,62 V92"/>
    <path d="M380,152 V182"/>
    <path d="M330,152 Q200,170 160,92" stroke-dasharray="5 4"/>
    <path d="M380,232 V256 H130 V268"/>
    <path d="M380,232 V268"/>
    <path d="M380,232 V256 H630 V268"/>
    <path d="M130,338 V354 H380 V372"/>
    <path d="M380,338 V372"/>
    <path d="M630,338 V354 H380"/>
  </g>
  <g font-size="14" text-anchor="middle">
