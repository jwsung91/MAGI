    <text x="380" y="138" fill="#4338ca" font-size="12">안건 · 등급 · 전제 · 프리셋 · 후속 안건</text>

    <rect x="40" y="62" width="150" height="30" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="115" y="82" fill="#92400e" font-size="12">추가 정보 요청 (≤3)</text>

    <rect x="280" y="182" width="200" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="380" y="204" fill="#111827" font-weight="600">진행자</text>
    <text x="380" y="222" fill="#374151" font-size="12">안건을 고치지 않고 전달</text>

    <rect x="40" y="268" width="180" height="70" rx="8" fill="#ecfdf5" stroke="#10b981"/>
