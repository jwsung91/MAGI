<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', sans-serif">
  <title>MAGI deliberation flow</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="760" height="470" fill="#ffffff"/>
  <g stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M380,62 V92"/>
    <path d="M380,152 V182"/>
    <path d="M300,152 Q190,170 160,92" stroke-dasharray="5 4"/>
    <path d="M380,232 V256 H130 V268"/>
    <path d="M380,232 V268"/>
    <path d="M380,232 V256 H630 V268"/>
    <path d="M130,338 V354 H380 V372"/>
    <path d="M380,338 V372"/>
    <path d="M630,338 V354 H380"/>
  </g>
  <g font-size="14" text-anchor="middle">
    <rect x="270" y="20" width="220" height="42" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="380" y="46" fill="#111827">User request (kept verbatim)</text>

    <rect x="220" y="92" width="320" height="60" rx="8" fill="#eef2ff" stroke="#6366f1"/>
    <text x="380" y="117" fill="#312e81" font-weight="600">Framing agent</text>
    <text x="380" y="138" fill="#4338ca" font-size="12">Proposal · grade · premises · preset · follow-ups</text>

    <rect x="40" y="62" width="150" height="30" rx="6" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="115" y="82" fill="#92400e" font-size="12">Questions for user (≤3)</text>

    <rect x="280" y="182" width="200" height="50" rx="8" fill="#f3f4f6" stroke="#9ca3af"/>
    <text x="380" y="204" fill="#111827" font-weight="600">Moderator</text>
    <text x="380" y="222" fill="#374151" font-size="12">Passes the proposal unchanged</text>

    <rect x="40" y="268" width="180" height="70" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="130" y="296" fill="#065f46" font-weight="600">MELCHIOR-1</text>
    <text x="130" y="318" fill="#047857" font-size="12">Technical feasibility</text>

    <rect x="290" y="268" width="180" height="70" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="380" y="296" fill="#065f46" font-weight="600">BALTHASAR-2</text>
    <text x="380" y="318" fill="#047857" font-size="12">Safety and sustainability</text>

    <rect x="540" y="268" width="180" height="70" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="630" y="296" fill="#065f46" font-weight="600">CASPER-3</text>
    <text x="630" y="318" fill="#047857" font-size="12">Needs and value</text>

    <text x="392" y="249" fill="#6b7280" font-size="11" text-anchor="start">Independent subagents, blind to each other</text>

    <rect x="160" y="372" width="440" height="76" rx="8" fill="#fef2f2" stroke="#ef4444"/>
    <text x="380" y="396" fill="#7f1d1d" font-weight="600">Resolution</text>
    <text x="380" y="416" fill="#991b1b" font-size="12">Normal: 2/3 majority · Critical: all three approve</text>
    <text x="380" y="434" fill="#991b1b" font-size="12">Passed · Rejected · Error · Info</text>
