    <text x="130" y="318" fill="#047857" font-size="12">기술적 타당성</text>

    <rect x="290" y="268" width="180" height="70" rx="8" fill="#ecfdf5" stroke="#10b981"/>
    <text x="380" y="296" fill="#065f46" font-weight="600">BALTHASAR-2</text>
    <text x="380" y="318" fill="#047857" font-size="12">안전과 지속성</text>

    <rect x="540" y="268" width="180" height="70" rx="8" fill="#ecfdf5" stroke="#10b981"/>
