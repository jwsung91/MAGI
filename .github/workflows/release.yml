name: Release

# Runs on every push to main. If the version in .claude-plugin/plugin.json has
# no tag yet, it creates tag v<version> and a GitHub Release with the skill zip
# (for upload to the Claude app) and the plugin zip (for ChatGPT and Codex) in this same job. Creating the tag here, not in
# a separate tag-triggered workflow, matters: events made with GITHUB_TOKEN do
# not start other workflow runs. If the tag already exists, the job does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read and check version
        id: version
        run: |
          version="$(python3 .github/scripts/release_tools.py check-release)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build skill zip
        if: steps.version.outputs.exists == 'false'
        run: |
          cd skills
          zip -r "../magi-${{ steps.version.outputs.version }}.zip" magi -x '*/__pycache__/*'

      # Chat zip: the skill folder without scripts/, for chat apps that refuse
      # skills containing executable files (the Gemini app). Only the optional
      # progress-log helper is left out; the skill skips logging without it.
      - name: Build chat zip
        if: steps.version.outputs.exists == 'false'
        run: |
          cd skills
          zip -r "../magi-chat-${{ steps.version.outputs.version }}.zip" magi -x 'magi/scripts/*' '*/__pycache__/*'

      # Plugin zip for ChatGPT and Codex uploads: the Codex manifest and
      # skills/<name>/SKILL.md at the archive root. Files are made readable
      # (644) because uploads with owner-only permissions can fail to register.
      - name: Build plugin zip
        if: steps.version.outputs.exists == 'false'
        run: |
          stage="$(mktemp -d)"
          cp -r .codex-plugin skills LICENSE "$stage/"
          find "$stage" -name __pycache__ -prune -exec rm -rf {} +
          chmod -R u+rwX,go+rX,go-w "$stage"
          (cd "$stage" && zip -r -X "$GITHUB_WORKSPACE/magi-plugin-${{ steps.version.outputs.version }}.zip" .codex-plugin skills LICENSE)

      - name: Create tag and release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 .github/scripts/release_tools.py notes "$VERSION" > notes.md
          gh release create "v$VERSION" "magi-$VERSION.zip" "magi-chat-$VERSION.zip" "magi-plugin-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "MAGI $VERSION" \
            --notes-file notes.md
