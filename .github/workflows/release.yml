name: Release

# Runs on every push to main. If the version in .claude-plugin/plugin.json has
# no tag yet, it creates tag v<version> and a GitHub Release with the skill zip
# (for upload to the Claude app) in this same job. Creating the tag here, not in
# a separate tag-triggered workflow, matters: events made with GITHUB_TOKEN do
# not start other workflow runs. If the tag already exists, the job does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read and check version
        id: version
        run: |
          version="$(python3 .github/scripts/release_tools.py check-release)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build skill zip
        if: steps.version.outputs.exists == 'false'
        run: |
          cd skills
          zip -r "../magi-${{ steps.version.outputs.version }}.zip" magi -x '*/__pycache__/*'

      - name: Create tag and release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 .github/scripts/release_tools.py notes "$VERSION" > notes.md
          gh release create "v$VERSION" "magi-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "MAGI $VERSION" \
            --notes-file notes.md
